<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- The portal must never be served stale from the phone's cache, or a fix
     never reaches the guide. These stop future caching; the version check in
     the script reloads the page the moment a new build is deployed. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Guide Portal — Roots &amp; Roads</title>
<link rel="icon" type="image/png" href="/images/blackWhite_Logo_v2.png?v=1">
<style>
  :root{

    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  }

.bnoteta{width:100%;min-height:56px;border:1px solid #e7e1d8;border-radius:8px;padding:8px;font:inherit;resize:vertical;box-sizing:border-box}

.bnotesave{background:#111;color:#fff;border:none;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}

</style>

<body>
<div class="wrap">

  <div id="loginView" class="login">
    <h2>Guide Portal</h2>
    <p>Roots &amp; Roads — sign in to see your tours.</p>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn">Sign in</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="dashView" class="hidden">
    <div class="topbar">
      <div><h1>Tours</h1><div id="who" class="who"></div></div>
      <button id="logoutBtn" class="iconbtn">Log out</button>
    </div>
    <div class="tabs">
      <button id="tabTours" class="tab active">My tours</button>
      <button id="tabSched" class="tab">All guides</button>
    </div>
    <div id="fresh" class="fresh"></div>
    <div id="toursPane"><div class="spin">Loading…</div></div>
    <div id="schedPane" class="hidden"></div>
    <div id="ver" class="ver"></div>
  </div>

</div>

<script>
/* ================== CONFIG ================== */
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbxzl4w3VSVj4Tln9H3hcjuNZ_Z7J8zu7iI5ZPq9P4Ag6rZ19-XYgx_qWjFLohAa7iEf/exec";
/* Bump this string on every portal deploy. It is shown at the bottom of the
   page AND used to auto-reload the phone when a newer build is live, so a fix
   can never be stuck behind a stale cached page again. */
const PORTAL_VERSION = "2026-08-31-windowed-loadmore";

/* Fetch our own page fresh (bypassing cache) and, if a newer version is
   deployed, reload once so the phone is always on the latest build. */
async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
    const txt = await res.text();
    const m = txt.match(/PORTAL_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] && m[1] !== PORTAL_VERSION){
      // Never hard-reload out from under someone mid-action — a half-typed new
      // tour, an open form, or an in-flight write. It reloads on the next check.
      if(MUTATING>0 || document.querySelector("details.openform[open]") || Date.now()-LAST_EDIT<8000) return;
      location.reload();
    }
  }catch(e){ /* offline / transient — try again next time */ }
}

/* ================== API (fetch first, JSONP fallback) ==================
   fetch gives REAL error information (HTTP status, login redirects), which
   JSONP cannot. If fetch itself is blocked (old browser, extension), we fall
   back to the classic JSONP script tag. */
console.log("R&R guide portal front-end v3");
function buildUrl(action, params){
  // _ = cache-buster: forces a fresh response so the portal never shows a
  // browser-cached copy of the BookingSheet/schedule data.
  const q = Object.assign({action, _: Date.now()}, params||{});
  return PORTAL_URL + "?" + Object.keys(q).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(q[k])).join("&");
}
function mkErr(kind,msg){ const e=new Error(msg); e.kind=kind; return e; }
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
/* One quiet retry on any NON-auth failure. A freshly-created deployment can 404
   for a minute while Google propagates it, and requests occasionally drop. Every
   portal call either reads, or sets a target state (move / assign / check-in),
   so re-sending is safe and can never double-apply. Auth errors are real config
   problems, so those are surfaced immediately, not retried. */
async function api(action, params){
  try{ return await apiCall(action, params); }
  catch(err){
    if(err && err.kind==="auth") throw err;
    await sleep(1000);
    return await apiCall(action, params);
  }
}
async function apiCall(action, params){
  const url = buildUrl(action, params);
  try{
    // Abort a hung request after 30s so the inflight guard is always released
    // and the next poll can try again (a dead network shouldn't freeze the app).
    const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 30000) : null;
    let res, text;
    try{
      res = await fetch(url, {method:"GET", redirect:"follow", cache:"no-store", signal: ctrl?ctrl.signal:undefined});
      text = await res.text();
    } finally { if(timer) clearTimeout(timer); }
    try{ return JSON.parse(text); }
    catch(_){
      if(/accounts\.google\.com/.test(res.url||"") || /ServiceLogin|Sign in - Google/i.test(text))
        throw mkErr("auth","The portal deployment is asking for a Google sign-in. A manager must set the web app's \"Who has access\" to Anyone and deploy a new version.");
      throw mkErr("badresp","The server answered, but not with portal data (HTTP "+res.status+"). The portal URL may point to a wrong or archived deployment.");
    }
  }catch(err){
    if(err && (err.kind==="auth"||err.kind==="badresp")) throw err;
    try{ return await apiJsonp(action, params); }
    catch(err2){ throw err2; }
  }
}
function apiJsonp(action, params){
  return new Promise((resolve,reject)=>{
    const cb = "cb_"+Math.random().toString(36).slice(2);
    const url = buildUrl(action, Object.assign({callback:cb}, params||{}));
    const s = document.createElement("script");
    let done=false;
    window[cb]=(data)=>{ done=true; cleanup(); resolve(data); };
    function cleanup(){ delete window[cb]; s.remove(); }
    s.onerror=()=>{ if(!done){cleanup(); reject(mkErr("network","NETWORK"));} };
    s.src=url; document.body.appendChild(s);
    setTimeout(()=>{ if(!done){cleanup(); reject(mkErr("timeout","TIMEOUT"));} }, 30000);   // match the fetch timeout — don't declare a slow-but-alive server dead early
  });
}
function serverTestLink(){
  return '<br><a class="testlink" target="_blank" rel="noopener" href="'+buildUrl("health",{})+'">Test server connection</a>';
}

/* Read a time a manager typed for a tour move. Accepts "4:30 PM", "16:30",
   "4pm", "4:30", "16". A bare afternoon hour (1–7, no am/pm) is read as PM,
   because tours run in the daytime — "4:30" means 16:30, not 04:30. Returns
   {t24:"H:MM", label:"4:30 PM"} in unambiguous 24h for the server, or null. */
function parseTypedTime(raw){
  const s=String(raw||"").trim(); let h, mm, m;
  if((m=s.match(/^(\d{1,2}):(\d{2})\s*([ap])m?$/i))){ h=(+m[1])%12; if(/p/i.test(m[3]))h+=12; mm=m[2]; }
  else if((m=s.match(/^(\d{1,2})\s*([ap])m?$/i))){ h=(+m[1])%12; if(/p/i.test(m[2]))h+=12; mm="00"; }
  else if((m=s.match(/^(\d{1,2}):(\d{2})$/))){ h=+m[1]; mm=m[2]; if(h>=1&&h<=7)h+=12; }
  else if((m=s.match(/^(\d{1,2})$/))){ h=+m[1]; mm="00"; if(h>=1&&h<=7)h+=12; }
  else return null;
  if(h<0||h>23||(+mm)>59) return null;
  const h12=((h+11)%12)+1, suf=h>=12?"PM":"AM";
  return { t24:h+":"+mm, label:h12+":"+mm+" "+suf };
}

/* ================== STATE / HELPERS ================== */
/* localStorage (not sessionStorage): survives the phone killing the tab, so
   guides stay logged in (~30 days, server-enforced) and the last tour list
   renders instantly while fresh data loads. */
const store = {
  get token(){ return localStorage.getItem("rr_token"); },
  set token(v){ v?localStorage.setItem("rr_token",v):localStorage.removeItem("rr_token"); },
  get name(){ return localStorage.getItem("rr_name")||""; },
  set name(v){ localStorage.setItem("rr_name",v||""); },
  get cache(){ try{ return JSON.parse(localStorage.getItem("rr_tours")||"null"); }catch(e){ return null; } },
  set cache(v){ try{ v?localStorage.setItem("rr_tours",JSON.stringify(v)):localStorage.removeItem("rr_tours"); }catch(e){} },
  // Which tab the user was last on ("tours" = My tours, "sched" = All tours /
  // All guides). Persisted so a reload keeps you where you were — a manager lives
  // in All tours and shouldn't be bounced back to My tours on every refresh.
  get tab(){ return localStorage.getItem("rr_tab")||""; },
  set tab(v){ try{ localStorage.setItem("rr_tab", v||""); }catch(e){} }
};
let DIRTY={}, TOURS_CACHE=[], MANAGER=false, GUIDES_BY_LANG={};
let HAS_MORE=false, WINDOW_DAYS=7, MANAGER_DAYS=0; const MORE_DAYS=14;   // manager All-tours window
let LAST_FRESH="";                                                       // last successful refresh time
let LOAD_FAILS=0;                        // consecutive failed loads — gates the "can't reach" banner
let RETRY_TIMER=null;                    // pending soft auto-retry after a miss
const PAGE_T0=Date.now();                // when this page opened (client-perceived timing)
let LOAD_START=0, LOAD_NAV="initial";    // current load's start time + what triggered it
/* Tell the server analytics what a load ACTUALLY did on the phone: completed
   (ok), timed out, errored, or was cut short by an early reload (abort). This is
   how the timing report can separate a genuinely slow load from one the owner
   reloaded before it finished. keepalive so it still sends during page-unload.
   Only fires on the initial load, failures, and aborts — never routine polls. */
function beacon(ev, ms, nav){
  try{
    const u = buildUrl("clientlog", {ev:ev, ms:Math.max(0,Math.round(ms||0)), nav:nav||"", days:MANAGER_DAYS||0});
    if(window.fetch){ fetch(u,{method:"GET",keepalive:true,cache:"no-store"}).catch(()=>{}); }
    else { new Image().src=u; }
  }catch(e){}
}
function setFresh(state,t){
  const el=$("fresh"); if(!el) return;
  if(state==="loading"){ el.className="fresh loading"; el.textContent=LAST_FRESH?("Updating… (was "+LAST_FRESH+")"):"Updating…"; return; }
  if(state==="ok"){ if(t) LAST_FRESH=t; el.className="fresh"; el.textContent="Up to date · "+(LAST_FRESH||""); return; }
  el.className="fresh stale"; el.textContent=LAST_FRESH?("Can't refresh — showing "+LAST_FRESH):"Can't reach the server";
}

// Send credentials in the POST BODY, not the URL query string (so the password
// never lands in a request URL / server log). Falls back to the GET api() if a
// POST response can't be read, so login can never break.
async function loginRequest_(email, password){
  try{
    const body=new URLSearchParams({action:"login", _:Date.now(), email:email, password:password});
    const res=await fetch(PORTAL_URL, {method:"POST", body:body, redirect:"follow", cache:"no-store"});
    return JSON.parse(await res.text());
  }catch(e){
    return await api("login", {email:email, password:password});
  }
}
async function doLogin(){
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){ $("loginErr").textContent="Enter email and password."; return; }
  $("loginBtn").disabled=true; $("loginErr").textContent="";
  try{
    const r=await loginRequest_(email,password);
    if(!r.ok){ $("loginErr").textContent=r.error||"Login failed"; $("loginBtn").disabled=false; return; }
    store.token=r.token; store.name=r.guide.name; showDash();
  }catch(err){
    const msg = err&&err.kind==="network" ? "Can't reach the server — check your internet connection."
      : err&&err.kind==="timeout" ? "Server took too long — try again."
      : err.message;
    $("loginErr").innerHTML = esc(msg) + serverTestLink();
    $("loginBtn").disabled=false;
  }
}

/* Keep the portal in sync with the BookingSheet without a manual reload. Polls
   the server, but never while the user is mid-edit (recent interaction or a
   focused control), so unsaved check-ins are never clobbered. Also refreshes
   the moment the tab regains focus. */
let LAST_EDIT = 0;
// Only ACTUAL edit controls suppress the refresh — not merely tapping to expand
// a card. So a manager watching the list keeps polling and sees another guide's
// check-ins within seconds, while someone mid-edit is still protected.
// Any touch/type/change on an edit control (a note, the move dropdowns, or the
// "Open a schedule" form) marks the user as mid-edit so the poll holds off.
const EDIT_SEL = ".ckin,.js-inc,.js-dec,.asgsel,.mvsel,.mv-lang,.mv-time,.mv-date,.mv-go,.bnoteta,.bnotesave,.of-open,.of-date,.of-time,.of-lang,.of-guide,.openform";
document.addEventListener("input",  e=>{ if(e.target.closest && e.target.closest(EDIT_SEL)) LAST_EDIT=Date.now(); }, true);
document.addEventListener("change", e=>{ if(e.target.closest && e.target.closest(EDIT_SEL)) LAST_EDIT=Date.now(); }, true);
document.addEventListener("pointerdown", e=>{ if(e.target.closest && e.target.closest(EDIT_SEL)) LAST_EDIT=Date.now(); }, true);
let MUTATING = 0;   // >0 while a write (assign/save/move/…) is in flight
function canAutoRefresh(){
  if(!store.token || document.hidden) return false;
  if(MUTATING > 0) return false;                          // never poll mid-write
  // Never re-render while the "Open a schedule" form is open — a poll would wipe
  // the half-filled new tour before it can be submitted.
  if(document.querySelector("details.openform[open]")) return false;
  if(Date.now()-LAST_EDIT < 8000) return false;           // just used a control
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||"") && a.closest && a.closest("#toursPane,#schedPane")) return false; // typing/choosing in a field
  return true;
}
function startAutoRefresh(){
  if(window._rrRefresh) return;
  // Poll every 20s. Fast enough that a co-guide's check-in shows within seconds,
  // but slow enough that loads never overlap (the inflight guard drops any that
  // would). The old 8s poll fired faster than loads completed, so requests piled
  // up and each got slower.
  window._rrRefresh = setInterval(()=>{ ckFlush(); if(canAutoRefresh()) loadTours("poll"); }, 20000);
  // Check for a newer deployed build every 2 min and when the tab regains focus.
  window._rrVerCheck = setInterval(checkForUpdate, 120000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ checkForUpdate(); ckFlush(); if(canAutoRefresh()) loadTours("focus"); } });
  window.addEventListener("focus", ()=>{ checkForUpdate(); ckFlush(); if(canAutoRefresh()) loadTours("focus"); });
  window.addEventListener("online", ckFlush);   // signal came back -> push queued check-ins
  // Reloaded/closed the page mid-load? Tell the analytics it was cut short (not a
  // slow server) — this is the "sometimes I reload before it finishes" case.
  window.addEventListener("pagehide", ()=>{ if(LOADING) beacon("abort", Date.now()-LOAD_START, LOAD_NAV); });
}
// A monotonic id per load. Only the NEWEST request may render — a slow, stale
// response (e.g. an auto-refresh that read the grid before a manager's assign)
// can never land late and revert the screen. This is what made assignments
// look like they "didn't stick, then kicked in later".
let LOAD_SEQ = 0;
let LOADING = false;   // one tours request at a time — never let polls pile up
async function loadTours(nav){
  // A tours load can take several seconds. The 20s poll (and focus/visibility
  // events) must NOT start a second one while the first is still running, or
  // requests stack up, serialize on the server, and each gets slower — which is
  // exactly what turned ~8s loads into 60-120s ones. Skip if one is in flight.
  if(LOADING) return;
  if(RETRY_TIMER){ clearTimeout(RETRY_TIMER); RETRY_TIMER=null; }
  LOADING = true; LOAD_NAV = nav||"poll"; LOAD_START = Date.now();
  setFresh("loading");
  const seq = ++LOAD_SEQ;
  if(!store.cache) $("toursPane").innerHTML='<div class="spin">Loading…</div>';
  const params={token:store.token}; if(MANAGER_DAYS>0) params.days=MANAGER_DAYS;
  let r; try{ r=await api("tours",params); }
  catch(err){ LOADING=false; if(seq!==LOAD_SEQ) return; onLoadFailed(err); return; }
  LOADING = false;
  if(seq!==LOAD_SEQ) return;                 // a newer load has superseded this one
  if(!r.ok){ if(/expired/i.test(r.error||"")){ store.token=""; store.cache=null; location.reload(); return; }
    onLoadFailed(mkErr("server", r.error||"Server error")); return; }
  const took = Date.now()-LOAD_START;
  // Report first-paint time and any recovery-after-failure, so the analytics can
  // see real completed-load times (vs the aborts/timeouts reported below).
  if(LOAD_FAILS>0 || LOAD_NAV==="initial") beacon("ok", took, LOAD_NAV);
  LOAD_FAILS=0;
  setFresh("ok", r.now);
  store.cache=r;
  renderAll(r);
}
/* One miss shouldn't slap "Can't reach the server" over good data — a mobile
   blip or a single slow response is normal. Keep the last list, retry quietly in
   a few seconds, and only show the banner after TWO misses in a row. Every miss
   is reported so the timing report separates true outages from an early reload. */
function onLoadFailed(err){
  LOAD_FAILS++;
  beacon(err && err.kind==="timeout" ? "timeout" : "error", Date.now()-LOAD_START, LOAD_NAV);
  if(LOAD_FAILS < 2){
    setFresh("loading");                      // still "Updating…" — we're quietly retrying
    if(RETRY_TIMER) clearTimeout(RETRY_TIMER);
    RETRY_TIMER=setTimeout(()=>{ RETRY_TIMER=null; loadTours("retry"); }, 3000);
    return;
  }
  setFresh("stale");                          // now it's a real problem — say so
  if(!store.cache){ showLoadError(err); return; }  // nothing cached -> replace the screen
  // We DO have a good cached view. Restore it so the UI isn't stuck — a "Load
  // more" that failed on a slow phone otherwise left its button frozen on
  // "Loading…". If this was a "Load more" (a wider window than the cached one),
  // fall back to the cached window so we stop retrying a too-heavy request; the
  // button reverts to tappable and the user can try again.
  const cachedWin = Number(store.cache.windowDays)||0;
  if(cachedWin>0 && MANAGER_DAYS>cachedWin) MANAGER_DAYS = cachedWin;
  renderAll(store.cache);
}
/* ---- Pending assignments: the real fix for the "reverts to Albert" bug ----
   After you assign Carlos, Google's Sheets backend may still serve the very
   next read from a replica that hasn't caught up, returning the OLD guide. So
   we remember what you just set and force EVERY render to show it until the
   server actually agrees (or a timeout passes). A stale read can no longer
   revert the screen. */
const PENDING_TTL = 90000;               // hold the optimistic value up to 90s
/* Persisted in localStorage so it SURVIVES A FULL PAGE RELOAD — reloading right
   after assigning used to wipe the in-memory overlay and let a stale read revert
   the screen. Now the pending value is reloaded on boot and keeps holding. */
function loadPending(){ try{ const p=JSON.parse(localStorage.getItem("rr_pending")||"{}"); const n=Date.now();
  Object.keys(p).forEach(k=>{ if(!p[k]||p[k].until<n) delete p[k]; }); return p; }catch(e){ return {}; } }
function savePending(){ try{ localStorage.setItem("rr_pending", JSON.stringify(PENDING_ASSIGN)); }catch(e){} }
let PENDING_ASSIGN = loadPending();      // shiftKey -> { guide, until }
function shiftIdKey(o){
  const isPriv=(o.isPrivate==1||o.isPrivate===true||o.isPrivate==="1");
  return o.dateKey+"|"+String(o.time)+"|"+o.language+"|"+(isPriv?("P"+(o.privIndex||1)):"R");
}
function setPendingAssign(info, guide){
  PENDING_ASSIGN[shiftIdKey(info)] = { guide: guide||"", until: Date.now()+PENDING_TTL };
  savePending();
}
/* Overlay pending assignments onto a tours payload, in place. Holds the value
   you just set for the whole settle window, then lets the server value through. */
function applyPendingAssigns(r){
  const now=Date.now();
  Object.keys(PENDING_ASSIGN).forEach(k=>{ if(PENDING_ASSIGN[k].until<now) delete PENDING_ASSIGN[k]; });
  if(!Object.keys(PENDING_ASSIGN).length) return;
  const overlay=s=>{
    const p=PENDING_ASSIGN[shiftIdKey(s)]; if(!p) return;
    // Impose the just-assigned value for the WHOLE window, regardless of what any
    // single read says. Google's sheet replicas are inconsistent for a few
    // seconds after a write, so consecutive reads flip between old and new —
    // clearing the moment one read "matched" let the next lagging read revert it
    // (the flip-back). We hold until the pending expires (PENDING_TTL), by which
    // time every replica has converged on the new value.
    s.assigned=p.guide?[p.guide]:[]; s.guide=p.guide||"";
    s.coGuides=p.guide?[p.guide]:[]; s.status=p.guide?"OK":"Not assigned";
  };
  (r.allTours||[]).forEach(overlay);
  (r.tours||[]).forEach(overlay);
  (r.schedule||[]).forEach(overlay);
}
/* Overlay not-yet-synced check-ins (the offline queue) onto the freshly loaded
   data, so a queued check-in still shows as done (✓ ⏳) after a reload instead of
   reverting to "Check in" and making the guide think it was lost. The server
   merge guarantees the data itself is safe; this keeps the SCREEN honest until
   the queue drains. */
function applyPendingCheckins(r){
  let q; try{ q=ckQueueLoad(); }catch(e){ return; }
  if(!q||!q.length) return;
  const pend={};
  q.forEach(item=>{ const d=item&&item.data; if(!d||!d.bookings) return;
    d.bookings.forEach(b=>{ if(b.checked&&b.bookingId) pend[b.bookingId]=Math.max(pend[b.bookingId]||0, +b.checkedIn||0); }); });
  if(!Object.keys(pend).length) return;
  const mark=list=>(list||[]).forEach(s=>(s.bookings||[]).forEach(b=>{
    if(b.bookingId in pend && !b.checked){ b.checked=true; b.checkedIn=pend[b.bookingId]; b.pending=true; }
  }));
  mark(r.tours); mark(r.allTours);
}
function renderAll(r){
  applyPendingAssigns(r);                // stale reads can never undo your last action
  applyPendingCheckins(r);               // a queued (offline) check-in still shows ✓ ⏳ after a reload
  MANAGER=!!r.manager;
  HAS_MORE=!!r.hasMore; WINDOW_DAYS=Number(r.windowDays)||7;
  GUIDES_BY_LANG=r.guidesByLanguage||{};
  const all=r.allTours||[];
  renderTours(r.tours||[], "toursPane");
  if(MANAGER){ renderTours(all, "schedPane", true); $("tabSched").textContent="All tours"; }
  else { renderSchedule(r.schedule||[]); $("tabSched").textContent="All guides"; }
  TOURS_CACHE = MANAGER ? (r.tours||[]).concat(all) : (r.tours||[]);
  bindTours(TOURS_CACHE);
  restoreTab();                          // keep the user on their last tab (no jump to My tours)
}

/* Diagnose a failed load: try the lightweight health endpoint to tell a dead
   connection apart from a server-side problem, then show a useful message. */
async function showLoadError(err){
  let msg, hint;
  if(err && (err.kind==="auth"||err.kind==="badresp")){
    msg = err.message;
    hint = "Tap the test link below: if it shows an error page or a Google sign-in instead of data, the deployment/URL is the problem (manager fix, not your phone).";
  } else {
    try{
      const h = await api("health",{});
      if(h && h.ok){ msg="The server is up but the tours request failed."; hint="Pull to refresh or tap Retry. If it keeps failing, tell Albert or Carlos."; }
      else { msg="The tour server reported a problem"+(h&&h.error?": "+h.error:"."); hint="Tell Albert or Carlos — this is a server-side issue, not your phone."; }
    }catch(e2){
      msg = err&&err.kind==="timeout" ? "The server took too long to answer." : "Can't reach the tour server.";
      hint = "Check your internet connection (try opening any website), then tap Retry.";
    }
  }
  $("toursPane").innerHTML='<div class="loaderr"><b>'+esc(msg)+'</b>'+esc(hint)+
    '<br><button class="retry" onclick="loadTours()">Retry</button>'+serverTestLink()+'</div>';
}

/* ================== TOUR CARDS ================== */
function groupByDay(items){
  const g={}; items.forEach(t=>{ (g[t.dateKey]=g[t.dateKey]||[]).push(t); });
  return Object.keys(g).sort().map(dk=>({dateKey:dk, items:g[dk]}));
}
function renderTours(tours, paneId, canAssign){
  const pane=$(paneId||"toursPane");
  const seen={}; tours=(tours||[]).filter(t=>{ if(seen[t.id]) return false; seen[t.id]=true; return true; });
  const opener = (canAssign && paneId==="schedPane") ? openScheduleForm() : "";
  if(!tours.length){ pane.innerHTML=opener+'<div class="empty">'+(paneId==="schedPane"?"No upcoming tours.":"No upcoming tours assigned to you.")+'</div>'; bindOpenForm(); return; }
  let html=opener;
  groupByDay(tours).forEach(day=>{
    html+='<div class="dayhdr"><div><div class="d">'+dayTitle(day.dateKey)+'</div><div class="m">'+monthTitle(day.dateKey)+'</div></div>'+relBadge(day.dateKey)+'</div>';
    // Within a day, a tour with guests but no guide sorts to the TOP so it can't be missed.
    if(canAssign) day.items.sort((a,b)=>{ const au=(!(a.assigned&&a.assigned.length)&&a.bookedGuests>0)?0:1, bu=(!(b.assigned&&b.assigned.length)&&b.bookedGuests>0)?0:1; return au-bu || String(a.time).localeCompare(String(b.time)); });
    // Times already running that day per language — the options for a manager's
    // "move to another time" dropdown (plus a "New time…" entry, added per row).
    const _mins=s=>{ const m=String(s||"").match(/(\d{1,2}):(\d{2})/); return m?(+m[1]*60 + +m[2]):0; };
    // ALL times running that day (any language) — so a move can go back to a time
    // that currently only exists in another language (e.g. 5 PM English) in one
    // step by also picking the language. "＋ New time…" is added per row.
    const dayTimes=[];
    day.items.forEach(t=>{ if(!dayTimes.some(x=>x.time===t.time)) dayTimes.push({time:t.time,timeLabel:t.timeLabel||t.time}); });
    dayTimes.sort((a,b)=>_mins(a.time)-_mins(b.time));
    day.items.forEach(t=> html+=tourCard(t, canAssign, dayTimes));
  });
  // Manager All-tours loads the near window first; "Load more" pulls the next
  // block of days on demand (far-out tours are costly and rarely needed now).
  if(canAssign && paneId==="schedPane" && HAS_MORE)
    html+='<button class="loadmore" id="loadMoreBtn">Load more (next '+MORE_DAYS+' days)</button>';
  pane.innerHTML=html;
  bindOpenForm();
  if(canAssign && paneId==="schedPane"){ const lm=$("loadMoreBtn"); if(lm) lm.onclick=()=>{ lm.disabled=true; lm.textContent="Loading…"; MANAGER_DAYS=(WINDOW_DAYS||7)+MORE_DAYS; loadTours(); }; }
}
/* Manager-only: open a brand-new schedule (pick day/date, time, language and,

/* Manager-only: dropdown of guides who SPEAK the tour's language. Picking one
   writes it into the Schedule_<Language> grid in bold (= a management lock). */
function assignSelect(t){
  // Server-computed: guides who speak the language AND have no other tour
  // within 5h. The current assignee stays listed even if now conflicted.
  let opts=(t.eligible||GUIDES_BY_LANG[t.language]||[]).slice();
  const cur=(t.assigned&&t.assigned[0])||"";
  if(cur && opts.indexOf(cur)===-1) opts=[cur].concat(opts);
  let html='<select class="asgsel" data-assign=\''+esc(JSON.stringify({dateKey:t.dateKey,time:t.time,language:t.language,isPrivate:t.isPrivate?1:"",privIndex:t.privIndex||1}))+'\'>';
  html+='<option value=""'+(cur?'':' selected')+'>Not assigned</option>';
  opts.forEach(n=>{ html+='<option value="'+esc(n)+'"'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'; });
  return html+'</select>';
}
function tourCard(t, canAssign, dayTimes){
  const missN = Math.max(0, t.bookedGuests - t.checkedGuests);
  const sub = missN>0 ? '<div class="sub">'+missN+' to check in</div>' : '<div class="sub done">all checked</div>';
  const assigned = (t.assigned && t.assigned.length) ? t.assigned : (canAssign ? [] : [store.name].concat(t.coGuides||[]));
  let chips = assigned.map(n=>'<span class="chip"><span class="avatar">'+esc(initials(n))+'</span>'+esc(n)+'</span>').join("");
  // A tour that HAS guests but NO guide is the thing a manager must not miss.

function bindTours(tours){
  TOURS_CACHE=tours;

      }catch(err){ ok=false; errMsg=err.message||"Network problem — try again"; }
      if(ok){
        // Confirmed. The optimistic overlay already shows it and HOLDS it through
        // the replica-settle window, so we do NOT re-read the grid now (a lagging
        // replica could otherwise flip it back). The next natural poll reconciles.
        if(store.cache) renderAll(store.cache);
      } else {
        delete PENDING_ASSIGN[shiftIdKey(info)];   // write failed -> drop the optimistic value
        try{ await loadTours(); }catch(e){}          // and show the real state
      }
      MUTATING--;
      if(!ok && errMsg) alert(errMsg);
    };
  });
  // Manager: move a booking to another LANGUAGE and/or TIME in one step. Changing
  // either dropdown reveals a "Move" button; clicking it applies BOTH at once, so
  // a language + time change never needs two moves or an intermediate tour.
  document.querySelectorAll(".mvbox").forEach(box=>{
    const info=JSON.parse(box.dataset.mv);
    const langSel=box.querySelector(".mv-lang"), timeSel=box.querySelector(".mv-time"), dateSel=box.querySelector(".mv-date"), go=box.querySelector(".mv-go");

    langSel.onchange=sync;
    timeSel.onchange=sync;   // "＋ New time…" also just reveals Move; it's resolved on click
    if(dateSel) dateSel.onchange=sync;   // a new day also reveals Move
    go.onclick=async ()=>{
      const toLanguage=langSel.value;
      let toTime=timeSel.value, timeLabel=(timeSel.options[timeSel.selectedIndex]&&timeSel.options[timeSel.selectedIndex].text)||timeSel.value;
      if(toTime==="__new__"){
        const typed=prompt("Move "+info.name+" to what time?\nType like 4:30 PM (or 16:30).","");
        if(!typed || !typed.trim()){ timeSel.value=info.fromTime; sync(); return; }
        const parsed=parseTypedTime(typed);
        if(!parsed){ alert("Couldn't read \""+typed+"\" as a time. Try 4:30 PM or 16:30."); timeSel.value=info.fromTime; sync(); return; }
        toTime=parsed.t24; timeLabel=parsed.label;   // send unambiguous 24h; show the clear label
      }
      const toDate=dateSel?dateSel.value:"";
      const langChange=(toLanguage!==info.fromLanguage), timeChange=(toTime!==info.fromTime), dateChange=(!!toDate && toDate!==info.fromDate);
      if(!langChange && !timeChange && !dateChange){ go.hidden=true; return; }
      // Build a clear "Move X to: …" summary from whatever changed.
      const bits=[]; if(langChange) bits.push(toLanguage); if(timeChange) bits.push(timeLabel);
      if(dateChange) bits.push(dayTitle(toDate)+" "+monthTitle(toDate));
      if(!confirm("Move "+info.name+" to:\n"+bits.join(" · ")+"\n\nIf no tour exists there yet, it will be created.")){
        langSel.value=info.fromLanguage; timeSel.value=info.fromTime; if(dateSel) dateSel.value=info.fromDate; sync(); return;
      }
      go.disabled=true; go.textContent="Moving…"; MUTATING++; LAST_EDIT=Date.now();
      try{
        const r=await api("move",{token:store.token, bookingId:info.bookingId, fromLanguage:info.fromLanguage, toLanguage:toLanguage, toTime: timeChange? toTime : "", toDate: dateChange? toDate : ""});
        if(!r.ok) alert(r.error||"Could not move");
      }catch(err){

      }finally{

        if(msg) msg.textContent="Saved ✓";
        // Update the cache so a background refresh doesn't clobber the just-typed note.
        const parts=ref.split("~"), t=TOURS_CACHE.find(x=>x.id===parts[0]);
        if(t&&t.bookings[+parts[1]]) t.bookings[+parts[1]].manualNote=r.note;

      }catch(err){ if(msg) msg.textContent="Network problem"; b.disabled=false; }
    };
  });
  // Management: close a schedule — no confirmation, it just disappears (and

  document.querySelectorAll(".closebtn").forEach(btn=>{
    btn.onclick=async (e)=>{ e.stopPropagation();
      if(!confirm("Delete this tour? The guide is freed and the empty column is removed. It won't come back on its own.")) return;
      const id=btn.dataset.close; btn.disabled=true; LAST_EDIT=Date.now();
      const card=btn.closest(".tour"); if(card) card.remove();
      try{
        const r=await api("closeShift",{token:store.token, id:id});
        if(!r.ok){ alert(r.error||"Could not delete it"); loadTours(); return; }

      }catch(err){ alert("Network problem"); loadTours(); }
    };
  });
  // Check-in button per reservation: set the count, lock the row, save.
  document.querySelectorAll(".ckin:not(.done)").forEach(btn=>{
    btn.onclick=async ()=>{
      const parts=btn.dataset.ck.split("~"); const tid=parts[0], idx=+parts[1];
      const t=TOURS_CACHE.find(x=>x.id===tid); if(!t) return;
      const card=btn.closest('.tour');
      const sval=card.querySelector('.stepper[data-ref="bk|'+idx+'"] .val');
      const b=t.bookings[idx];
      const prev={checked:b.checked,checkedIn:b.checkedIn,checkedAt:b.checkedAt};
      const n=+(sval?sval.textContent:b.checkedIn);
      const _n=new Date(); const hhmm=String(_n.getHours()).padStart(2,"0")+":"+String(_n.getMinutes()).padStart(2,"0");
      // Show a SAVING state (not a confirmed ✓) and lock the row while it writes.
      b.checked=true; b.checkedIn=n;
      btn.disabled=true; btn.textContent="Saving…";
      const steps=card.querySelectorAll('.stepper[data-ref="bk|'+idx+'"] button'); steps.forEach(x=>x.disabled=true);
      recount(tid);

      if(ok){
        // CONFIRMED on the server — show the ✓.
        b.checkedAt=hhmm; btn.classList.add("done"); btn.textContent="✓ "+hhmm;
      } else {
        // Not confirmed yet — HOLD it on the phone and keep re-sending (offline
        // queue) instead of making the guide re-tap. It stays checked locally,
        // and syncs the moment the connection is back.
        ckEnqueue(buildTourData(tid));
        b.checkedAt=hhmm; btn.classList.add("done"); btn.textContent="✓ ⏳"; btn.title="Saved on your phone — syncing when back online";
      }

  });
  // MANAGER undo: tap a confirmed ✓ to delete that check-in cleanly (ledger +
  // feed, server-side, atomic). Guides and still-syncing (✓ ⏳) buttons stay
  // locked. This is the reliable "delete a check-in".
  if(MANAGER) document.querySelectorAll(".ckin.done:not([disabled])").forEach(btn=>{
    btn.title="Tap to undo this check-in";

      const parts=btn.dataset.ck.split("~"); const tid=parts[0], idx=+parts[1];

      const b=t.bookings[idx]; if(!b||!b.bookingId) return;

      const old=btn.textContent; btn.disabled=true; btn.textContent="Undoing…";
      MUTATING++; LAST_EDIT=Date.now();

      else { btn.disabled=false; btn.textContent=old; alert(errMsg||"Could not undo"); }
    };
  });
}
function recount(tourId){
  const card=document.querySelector('.tour[data-tour="'+cssq(tourId)+'"]'); let sum=0;
  const t=TOURS_CACHE.find(x=>x.id===tourId);
  card.querySelectorAll('.stepper[data-ref^="bk|"]').forEach(st=>{ const idx=+st.dataset.ref.split("|")[1]; const b=t&&t.bookings[idx]; if(b&&b.checked) sum+=+st.querySelector('.val').textContent; });
  card.querySelector('.count .ck').textContent=sum;
  const total=Number((TOURS_CACHE.find(x=>x.id===tourId)||{}).bookedGuests||0);
  const sub=card.querySelector('.count .sub'); const miss=Math.max(0,total-sum);
  sub.className='sub'+(miss?'':' done'); sub.textContent=miss?miss+' to check in':'all checked';
}
/* Build the save payload for a tour from its current card + cache. Shared by
   saveTour and the offline retry queue so a queued re-send matches exactly. */
function buildTourData(tourId){
  const t=TOURS_CACHE.find(x=>x.id===tourId); if(!t) return null;
  const card=document.querySelector('.tour[data-tour="'+cssq(tourId)+'"]');
  const bookings=t.bookings.map((b,i)=>{ const st=card?card.querySelector('.stepper[data-ref="bk|'+i+'"] .val'):null;
    return {bookingId:b.bookingId,source:b.source,name:b.name,phone:b.phone,guests:b.guests,children:b.children||0,income:b.income,isPrivate:b.isPrivate,manualNote:b.manualNote||"",checked:!!b.checked,checkedIn:+(st?st.textContent:b.checkedIn)}; });
  return {dateKey:t.dateKey,time:t.time,timeLabel:t.timeLabel,day:t.day,language:t.language,bookings,guide:t.guide||""};
}
/* ===== Offline-safe check-in queue =====
   A check-in whose save doesn't reach the server is kept on the PHONE and
   re-sent automatically until confirmed — surviving a dropped signal and a full
   reload. So a tapped check-in is never lost; the reconciler + the union read on
   the server make sure it lands in both the feed and the ledger. */
function ckQueueLoad(){ try{ return JSON.parse(localStorage.getItem("rr_ckqueue")||"[]"); }catch(e){ return []; } }
function ckQueueSave(q){ try{ localStorage.setItem("rr_ckqueue", JSON.stringify(q||[])); }catch(e){} }
function ckEnqueue(data){ if(!data) return; const q=ckQueueLoad(); q.push({data:data, ts:Date.now()}); ckQueueSave(q); }
function ckPending(){ return ckQueueLoad().length; }
let CK_FLUSHING=false;
async function ckFlush(){
  if(CK_FLUSHING || !store.token) return;
  const q=ckQueueLoad(); if(!q.length) return;
  CK_FLUSHING=true;
  const keep=[];
  for(const item of q){
    try{ const r=await api("save",{token:store.token,data:JSON.stringify(item.data)}); if(!(r&&r.ok)) keep.push(item); }
    catch(e){ keep.push(item); }   // still offline — try again next time
  }
  ckQueueSave(keep);
  CK_FLUSHING=false;
  if(keep.length!==q.length && canAutoRefresh()) loadTours();   // something synced -> refresh
}
async function saveTour(tourId,btn){
  const t=TOURS_CACHE.find(x=>x.id===tourId); if(!t) return false;
  const card=document.querySelector('.tour[data-tour="'+cssq(tourId)+'"]');
  const data=buildTourData(tourId); if(!data) return false;
  const msg=card.querySelector('[data-msg]'); if(btn) btn.disabled=true; msg.style.color="var(--muted)"; msg.textContent="Saving…";
  MUTATING++; LAST_EDIT=Date.now();   // block auto-refresh from clobbering the check-in mid-save
  let ok=false;
  try{ const r=await api("save",{token:store.token,data:JSON.stringify(data)});
    ok=!!(r&&r.ok);
    if(ok){ msg.style.color="var(--ok)"; msg.textContent="Saved ✓"; DIRTY[tourId]=false; }
    else{ msg.style.color="var(--danger)"; msg.textContent=(r&&r.error)||"Error"; } }
  catch(err){ msg.style.color="var(--danger)"; msg.textContent=err.message; }
  finally{ MUTATING--; }
  if(btn) btn.disabled=false; setTimeout(()=>{ if(!DIRTY[tourId]) msg.textContent=""; },4000);
  return ok;   // so the check-in button only confirms "✓" when the ledger write succeeded
}

/* ================== ALL GUIDES (read-only, non-managers) ================== */
function renderSchedule(rows){
  const pane=$("schedPane");
  if(!rows.length){ pane.innerHTML='<div class="empty">No upcoming schedule.</div>'; return; }
  let html="";
  groupByDay(rows).forEach(day=>{
    html+='<div class="dayhdr"><div><div class="d">'+dayTitle(day.dateKey)+'</div><div class="m">'+monthTitle(day.dateKey)+'</div></div>'+relBadge(day.dateKey)+'</div>';
    day.items.sort((a,b)=>String(a.time).localeCompare(String(b.time))).forEach(s=>{
      const miss = !s.assigned.length || (s.status && s.status!=="OK");
      const who = s.assigned.length
        ? s.assigned.map(n=>'<span class="chip"><span class="avatar">'+esc(initials(n))+'</span>'+esc(n)+'</span>').join(" ")
        : "Not assigned";
      html+='<div class="tour static"><div class="head">'+
        '<span class="time">'+esc(to12(s.time))+'</span>'+flagImg(s.language)+
        (s.private?'<span class="pill priv">Private</span>':'')+'<span class="spacer"></span>'+
        '<span class="guides'+(miss?' miss':'')+'">'+who+'</span></div></div>';
    });
  });
  pane.innerHTML=html;
}
