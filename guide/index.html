<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- The portal must never be served stale from the phone's cache, or a fix
     never reaches the guide. These stop future caching; the version check in
     the script reloads the page the moment a new build is deployed. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Guide Portal — Roots &amp; Roads</title>

<style>
  :root{
    --bg:#eef0f3; --card:#ffffff; --ink:#1a2b49; --muted:#8b90a0;
    --line:#eceef1; --blue:#0071eb; --green:#25d366; --amber:#f59e0b;
    --paid:#0071eb; --free:#f59e0b; --danger:#dc2626; --ok:#16a34a;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
  .wrap{max-width:600px;margin:0 auto;padding:14px 16px 72px}
  .hidden{display:none!important}
  .lbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;letter-spacing:.3px;vertical-align:middle;flex:none}
.flagmini{display:inline-flex;width:15px;height:11px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.65)}.flagmini svg{width:100%;height:100%;display:block}
.bnotebtn{background:#fef9c3;border:1px solid #fde047;border-radius:6px;padding:2px 5px;margin-left:6px;cursor:pointer;display:inline-flex;align-items:center;line-height:0;vertical-align:middle}.bnotebtn.has{background:#fde047;box-shadow:0 0 0 2px rgba(202,138,4,.3)}
.bnotepanel{background:#fffbeb;border:1px solid #fde047;border-radius:12px;padding:12px;margin:2px 2px 10px}
.bnoteta{width:100%;min-height:56px;border:1px solid #e7e1d8;border-radius:8px;padding:8px;font:inherit;resize:vertical;box-sizing:border-box}
.noteread{white-space:pre-wrap;padding:2px}
.noterow{display:flex;gap:8px;align-items:center;margin-top:8px}
.bnotesave{background:#111;color:#fff;border:none;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.bnoteclose{background:#fff;border:1px solid #ccc;border-radius:999px;padding:7px 12px;cursor:pointer}
.notemsg{font-size:.85rem;color:#555}
.closebtn{position:absolute;top:8px;right:8px;z-index:5;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e6c3c3;color:#c0392b;border-radius:50%;cursor:pointer;font-size:12px;font-weight:800;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}.closebtn:hover{background:#fdecec;border-color:#e08a8a}
.openform{background:#f4f7ff;border:1px solid #cdd9f5;border-radius:14px;padding:10px 14px;margin:0 0 14px}
.openform>summary{cursor:pointer;font-weight:800;color:#2547a0;list-style:none}
.openform .ofrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.openform label{display:flex;flex-direction:column;font-size:.8rem;font-weight:700;color:#42506b;gap:4px;flex:1;min-width:120px}
.openform input,.openform select{padding:7px 9px;border:1px solid #cdd9f5;border-radius:9px;font:inherit;font-weight:600}
.of-open{background:#2547a0;color:#fff;border:none;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
.of-msg{font-size:.85rem;color:#42506b;align-self:center}
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;font-weight:800;text-transform:uppercase;margin-right:5px;flex:none}

  .stepper{display:flex;align-items:center;gap:7px}

  .ckin{border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;margin-left:2px}

  .empty{text-align:center;color:var(--muted);padding:50px 10px}

  .testlink{display:inline-block;margin-top:12px;color:var(--blue);font-weight:700;font-size:13px}
  .asgsel{margin-left:6px;padding:6px 8px;border:1px solid #dfe3e8;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink);background:#fff;max-width:150px}
  .chip.miss{background:#fff7ed;color:#b45309;font-style:italic}
  .bnote{font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
  .mvsel{margin-top:4px;padding:3px 6px;border:1px solid #e2e6ea;border-radius:7px;font-size:11px;color:var(--muted);background:#fff}
  .ver{text-align:center;color:var(--muted);font-size:11px;padding:14px 0 22px;opacity:.7}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="login">
    <h2>Guide Portal</h2>
    <p>Roots &amp; Roads — sign in to see your tours.</p>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>

      <button id="tabTours" class="tab active">My tours</button>

</div>

<script>
/* ================== CONFIG ================== */
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbxzl4w3VSVj4Tln9H3hcjuNZ_Z7J8zu7iI5ZPq9P4Ag6rZ19-XYgx_qWjFLohAa7iEf/exec";
/* Bump this string on every portal deploy. It is shown at the bottom of the
   page AND used to auto-reload the phone when a newer build is live, so a fix
   can never be stuck behind a stale cached page again. */
const PORTAL_VERSION = "2026-08-03-fast-portal";

/* Fetch our own page fresh (bypassing cache) and, if a newer version is
   deployed, reload once so the phone is always on the latest build. */
async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
    const txt = await res.text();
    const m = txt.match(/PORTAL_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] && m[1] !== PORTAL_VERSION){ location.reload(); }
  }catch(e){ /* offline / transient — try again next time */ }
}

/* ================== API (fetch first, JSONP fallback) ==================
   fetch gives REAL error information (HTTP status, login redirects), which
   JSONP cannot. If fetch itself is blocked (old browser, extension), we fall
   back to the classic JSONP script tag. */
console.log("R&R guide portal front-end v3");
function buildUrl(action, params){
  // _ = cache-buster: forces a fresh response so the portal never shows a
  // browser-cached copy of the BookingSheet/schedule data.
  const q = Object.assign({action, _: Date.now()}, params||{});
  return PORTAL_URL + "?" + Object.keys(q).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(q[k])).join("&");
}
function mkErr(kind,msg){ const e=new Error(msg); e.kind=kind; return e; }
async function api(action, params){
  const url = buildUrl(action, params);
  try{
    // Abort a hung request after 30s so the inflight guard is always released
    // and the next poll can try again (a dead network shouldn't freeze the app).
    const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 30000) : null;
    let res, text;
    try{
      res = await fetch(url, {method:"GET", redirect:"follow", cache:"no-store", signal: ctrl?ctrl.signal:undefined});
      text = await res.text();
    } finally { if(timer) clearTimeout(timer); }
    try{ return JSON.parse(text); }
    catch(_){
      if(/accounts\.google\.com/.test(res.url||"") || /ServiceLogin|Sign in - Google/i.test(text))
        throw mkErr("auth","The portal deployment is asking for a Google sign-in. A manager must set the web app's \"Who has access\" to Anyone and deploy a new version.");
      throw mkErr("badresp","The server answered, but not with portal data (HTTP "+res.status+"). The portal URL may point to a wrong or archived deployment.");
    }
  }catch(err){
    if(err && (err.kind==="auth"||err.kind==="badresp")) throw err;
    try{ return await apiJsonp(action, params); }
    catch(err2){ throw err2; }
  }
}
function apiJsonp(action, params){
  return new Promise((resolve,reject)=>{
    const cb = "cb_"+Math.random().toString(36).slice(2);
    const url = buildUrl(action, Object.assign({callback:cb}, params||{}));
    const s = document.createElement("script");
    let done=false;
    window[cb]=(data)=>{ done=true; cleanup(); resolve(data); };
    function cleanup(){ delete window[cb]; s.remove(); }
    s.onerror=()=>{ if(!done){cleanup(); reject(mkErr("network","NETWORK"));} };
    s.src=url; document.body.appendChild(s);
    setTimeout(()=>{ if(!done){cleanup(); reject(mkErr("timeout","TIMEOUT"));} }, 20000);
  });
}
function serverTestLink(){
  return '<br><a class="testlink" target="_blank" rel="noopener" href="'+buildUrl("health",{})+'">Test server connection</a>';
}

/* ================== STATE / HELPERS ================== */
/* localStorage (not sessionStorage): survives the phone killing the tab, so
   guides stay logged in (~30 days, server-enforced) and the last tour list
   renders instantly while fresh data loads. */
const store = {
  get token(){ return localStorage.getItem("rr_token"); },
  set token(v){ v?localStorage.setItem("rr_token",v):localStorage.removeItem("rr_token"); },
  get name(){ return localStorage.getItem("rr_name")||""; },
  set name(v){ localStorage.setItem("rr_name",v||""); },
  get cache(){ try{ return JSON.parse(localStorage.getItem("rr_tours")||"null"); }catch(e){ return null; } },
  set cache(v){ try{ v?localStorage.setItem("rr_tours",JSON.stringify(v)):localStorage.removeItem("rr_tours"); }catch(e){} }
};
let RATES={paid:10,free:6}, DIRTY={}, TOURS_CACHE=[], MANAGER=false, GUIDES_BY_LANG={};
const POSTIT='<svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 3h16v12l-5 5H4z" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/><path d="M15 20v-5h5z" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/></svg>';

const LANG={
  English:{c:"EN",col:"#2563eb",f:"🇬🇧"}, Spanish:{c:"ES",col:"#dc2626",f:"🇪🇸"},
  German:{c:"DE",col:"#111827",f:"🇩🇪"},  French:{c:"FR",col:"#7c3aed",f:"🇫🇷"},
  Italian:{c:"IT",col:"#16a34a",f:"🇮🇹"}, Portuguese:{c:"PT",col:"#0891b2",f:"🇵🇹"},
  Dutch:{c:"NL",col:"#ea580c",f:"🇳🇱"},   Catalan:{c:"CA",col:"#d97706",f:"🇦🇩"}
};
function langMeta(l){
  if(LANG[l]) return LANG[l];
  const c=String(l||"?").replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"?";
  const cols=["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#111827","#ea580c"];
  let h=0; for(const ch of String(l)) h=(h*31+ch.charCodeAt(0))>>>0;
  return {c, col:cols[h%cols.length]};
}
// Show the country flag emoji inside the language's colour chip. On platforms
// that don't render flag emoji (e.g. Windows) it falls back to the 2-letter
// code, and the distinct colour still tells the languages apart.
/* Real inline-SVG flags render on every device (Windows browsers show flag
   emoji as "GB/FR/DE" letters, which is why they looked gone). Unknown
   languages fall back to the coloured 2-letter badge. */
const FLAGSVG={
  English:'<svg viewBox="0 0 60 30" preserveAspectRatio="none"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30 M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30 M60,0 0,30" stroke="#C8102E" stroke-width="4"/><rect x="25" width="10" height="30" fill="#fff"/><rect y="10" width="60" height="10" fill="#fff"/><rect x="27" width="6" height="30" fill="#C8102E"/><rect y="12" width="60" height="6" fill="#C8102E"/></svg>',
  German:'<svg viewBox="0 0 5 3" preserveAspectRatio="none"><rect width="5" height="3" fill="#FFCE00"/><rect width="5" height="2" fill="#D00"/><rect width="5" height="1" fill="#000"/></svg>',
  Spanish:'<svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="3" height="2" fill="#AA151B"/><rect y="0.5" width="3" height="1" fill="#F1BF00"/></svg>',
  Italian:'<svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="3" height="2" fill="#fff"/><rect width="1" height="2" fill="#009246"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>',
  French:'<svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="3" height="2" fill="#fff"/><rect width="1" height="2" fill="#0055A4"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>'
};
/* Colour circle per language with a little flag in the middle (falls back to
   the 2-letter code for a language without a flag SVG). */
function flagImg(lang){ const m=langMeta(lang); const s=FLAGSVG[lang]; return '<span class="lbadge" style="background:'+m.col+'" title="'+esc(lang)+'">'+(s?'<span class="flagmini">'+s+'</span>':m.c)+'</span>'; }
function initials(n){ const p=String(n||"").trim().split(/\s+/); return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase()||"?"; }
const WA_ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="#25d366" aria-label="WhatsApp"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.413c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.678-.985zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>';
const $ = id => document.getElementById(id);
const digits = p => String(p||"").replace(/[^\d]/g,"");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssq = s => String(s).replace(/"/g,'\\"');
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function parseKey(dk){ return new Date(dk+"T12:00:00"); }
function dayTitle(dk){ const d=parseKey(dk); return DAYS[d.getDay()]+" "+d.getDate(); }
function monthTitle(dk){ const d=parseKey(dk); return MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function relBadge(dk){
  const t=new Date(); const today=t.toISOString().slice(0,10);
  const tom=new Date(t.getTime()+864e5).toISOString().slice(0,10);
  if(dk===today) return '<span class="badge today">TODAY</span>';
  if(dk===tom)   return '<span class="badge tom">TOMORROW</span>';
  return '';
}
function to12(t){ const m=String(t).match(/^(\d{1,2}):(\d{2})$/); if(!m) return t; let h=+m[1]; const s=h>=12?'PM':'AM'; h=((h+11)%12)+1; return h+':'+m[2]+' '+s; }

$("loginBtn").onclick = doLogin;

async function doLogin(){
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){ $("loginErr").textContent="Enter email and password."; return; }
  $("loginBtn").disabled=true; $("loginErr").textContent="";
  try{
    const r=await api("login",{email,password});
    if(!r.ok){ $("loginErr").textContent=r.error||"Login failed"; $("loginBtn").disabled=false; return; }
    store.token=r.token; store.name=r.guide.name; showDash();
  }catch(err){
    const msg = err&&err.kind==="network" ? "Can't reach the server — check your internet connection."
      : err&&err.kind==="timeout" ? "Server took too long — try again."
      : err.message;
    $("loginErr").innerHTML = esc(msg) + serverTestLink();
    $("loginBtn").disabled=false;
  }
}

/* ================== LOAD ================== */
function showDash(){
  $("loginView").classList.add("hidden"); $("dashView").classList.remove("hidden");
  $("who").textContent=store.name;
  const v=$("ver"); if(v) v.textContent="Portal "+PORTAL_VERSION;
  const c=store.cache;
  if(c){ renderAll(c); }                 // instant render from the last load
  loadTours();                            // then refresh from the server
  startAutoRefresh();

}

/* Keep the portal in sync with the BookingSheet without a manual reload. Polls
   the server, but never while the user is mid-edit (recent interaction or a
   focused control), so unsaved check-ins are never clobbered. Also refreshes
   the moment the tab regains focus. */
let LAST_EDIT = 0;
// Only ACTUAL edit controls suppress the refresh — not merely tapping to expand
// a card. So a manager watching the list keeps polling and sees another guide's
// check-ins within seconds, while someone mid-edit is still protected.
document.addEventListener("input",  e=>{ if(e.target.closest && e.target.closest(".bnoteta,.noteta")) LAST_EDIT=Date.now(); }, true);
document.addEventListener("pointerdown", e=>{ if(e.target.closest && e.target.closest(".ckin,.js-inc,.js-dec,.asgsel,.mvsel,.bnoteta,.bnotesave,.of-open")) LAST_EDIT=Date.now(); }, true);
let MUTATING = 0;   // >0 while a write (assign/save/move/…) is in flight
function canAutoRefresh(){
  if(!store.token || document.hidden) return false;
  if(MUTATING > 0) return false;                          // never poll mid-write
  if(Date.now()-LAST_EDIT < 6000) return false;           // just used an edit control
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName||"") && a.closest && a.closest("#toursPane,#schedPane")) return false; // typing a note
  return true;
}
function startAutoRefresh(){
  if(window._rrRefresh) return;
  // Poll every 20s. Fast enough that a co-guide's check-in shows within seconds,
  // but slow enough that loads never overlap (the inflight guard drops any that
  // would). The old 8s poll fired faster than loads completed, so requests piled
  // up and each got slower.
  window._rrRefresh = setInterval(()=>{ if(canAutoRefresh()) loadTours(); }, 20000);
  // Check for a newer deployed build every 2 min and when the tab regains focus.
  window._rrVerCheck = setInterval(checkForUpdate, 120000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ checkForUpdate(); if(canAutoRefresh()) loadTours(); } });
  window.addEventListener("focus", ()=>{ checkForUpdate(); if(canAutoRefresh()) loadTours(); });
}
// A monotonic id per load. Only the NEWEST request may render — a slow, stale
// response (e.g. an auto-refresh that read the grid before a manager's assign)
// can never land late and revert the screen. This is what made assignments
// look like they "didn't stick, then kicked in later".
let LOAD_SEQ = 0;
let LOADING = false;   // one tours request at a time — never let polls pile up
async function loadTours(){
  // A tours load can take several seconds. The 20s poll (and focus/visibility
  // events) must NOT start a second one while the first is still running, or
  // requests stack up, serialize on the server, and each gets slower — which is
  // exactly what turned ~8s loads into 60-120s ones. Skip if one is in flight.
  if(LOADING) return;
  LOADING = true;
  const seq = ++LOAD_SEQ;
  if(!store.cache) $("toursPane").innerHTML='<div class="spin">Loading…</div>';
  let r; try{ r=await api("tours",{token:store.token}); }
  catch(err){ LOADING=false; if(seq!==LOAD_SEQ) return; await showLoadError(err); return; }
  LOADING = false;
  if(seq!==LOAD_SEQ) return;                 // a newer load has superseded this one
  if(!r.ok){ if(/expired/i.test(r.error||"")){ store.token=""; store.cache=null; location.reload(); return; }
    $("toursPane").innerHTML='<div class="loaderr"><b>Server error</b>'+esc(r.error||"Unknown error")+
      '<br><button class="retry" onclick="loadTours()">Retry</button></div>'; return; }
  store.cache=r;
  renderAll(r);
}
/* ---- Pending assignments: the real fix for the "reverts to Albert" bug ----
   After you assign Carlos, Google's Sheets backend may still serve the very
   next read from a replica that hasn't caught up, returning the OLD guide. So
   we remember what you just set and force EVERY render to show it until the
   server actually agrees (or a timeout passes). A stale read can no longer
   revert the screen. */
let PENDING_ASSIGN = {};                 // shiftKey -> { guide, until }
const PENDING_TTL = 90000;               // hold the optimistic value up to 90s
function shiftIdKey(o){
  const isPriv=(o.isPrivate==1||o.isPrivate===true||o.isPrivate==="1");
  return o.dateKey+"|"+String(o.time)+"|"+o.language+"|"+(isPriv?("P"+(o.privIndex||1)):"R");
}
function setPendingAssign(info, guide){
  PENDING_ASSIGN[shiftIdKey(info)] = { guide: guide||"", until: Date.now()+PENDING_TTL };
}
/* Overlay pending assignments onto a tours payload, in place. When the server's
   value matches what we set, the change is confirmed and the pending is cleared. */
function applyPendingAssigns(r){
  const now=Date.now();
  Object.keys(PENDING_ASSIGN).forEach(k=>{ if(PENDING_ASSIGN[k].until<now) delete PENDING_ASSIGN[k]; });
  if(!Object.keys(PENDING_ASSIGN).length) return;
  const overlay=s=>{
    const p=PENDING_ASSIGN[shiftIdKey(s)]; if(!p) return;
    const cur=(s.assigned&&s.assigned[0])||s.guide||"";
    if(cur===p.guide){ delete PENDING_ASSIGN[shiftIdKey(s)]; return; }   // server caught up
    s.assigned=p.guide?[p.guide]:[]; s.guide=p.guide||"";
    s.coGuides=p.guide?[p.guide]:[]; s.status=p.guide?"OK":"Not assigned";
  };
  (r.allTours||[]).forEach(overlay);
  (r.tours||[]).forEach(overlay);
  (r.schedule||[]).forEach(overlay);
}
function renderAll(r){
  applyPendingAssigns(r);                // stale reads can never undo your last action
  RATES=r.rates||RATES;
  MANAGER=!!r.manager;
  GUIDES_BY_LANG=r.guidesByLanguage||{};
  const all=r.allTours||[];
  renderTours(r.tours||[], "toursPane");
  if(MANAGER){ renderTours(all, "schedPane", true); $("tabSched").textContent="All tours"; }
  else { renderSchedule(r.schedule||[]); $("tabSched").textContent="All guides"; }
  TOURS_CACHE = MANAGER ? (r.tours||[]).concat(all) : (r.tours||[]);
  bindTours(TOURS_CACHE);
}

/* Diagnose a failed load: try the lightweight health endpoint to tell a dead
   connection apart from a server-side problem, then show a useful message. */
async function showLoadError(err){
  let msg, hint;
  if(err && (err.kind==="auth"||err.kind==="badresp")){
    msg = err.message;
    hint = "Tap the test link below: if it shows an error page or a Google sign-in instead of data, the deployment/URL is the problem (manager fix, not your phone).";
  } else {
    try{
      const h = await api("health",{});
      if(h && h.ok){ msg="The server is up but the tours request failed."; hint="Pull to refresh or tap Retry. If it keeps failing, tell Albert or Carlos."; }
      else { msg="The tour server reported a problem"+(h&&h.error?": "+h.error:"."); hint="Tell Albert or Carlos — this is a server-side issue, not your phone."; }
    }catch(e2){
      msg = err&&err.kind==="timeout" ? "The server took too long to answer." : "Can't reach the tour server.";
      hint = "Check your internet connection (try opening any website), then tap Retry.";
    }
  }
  $("toursPane").innerHTML='<div class="loaderr"><b>'+esc(msg)+'</b>'+esc(hint)+
    '<br><button class="retry" onclick="loadTours()">Retry</button>'+serverTestLink()+'</div>';
}

/* ================== TOUR CARDS ================== */
function groupByDay(items){
  const g={}; items.forEach(t=>{ (g[t.dateKey]=g[t.dateKey]||[]).push(t); });
  return Object.keys(g).sort().map(dk=>({dateKey:dk, items:g[dk]}));
}
function renderTours(tours, paneId, canAssign){
  const pane=$(paneId||"toursPane");
  const seen={}; tours=(tours||[]).filter(t=>{ if(seen[t.id]) return false; seen[t.id]=true; return true; });
  const opener = (canAssign && paneId==="schedPane") ? openScheduleForm() : "";
  if(!tours.length){ pane.innerHTML=opener+'<div class="empty">'+(paneId==="schedPane"?"No upcoming tours.":"No upcoming tours assigned to you.")+'</div>'; bindOpenForm(); return; }
  let html=opener;
  groupByDay(tours).forEach(day=>{
    html+='<div class="dayhdr"><div><div class="d">'+dayTitle(day.dateKey)+'</div><div class="m">'+monthTitle(day.dateKey)+'</div></div>'+relBadge(day.dateKey)+'</div>';
    day.items.forEach(t=> html+=tourCard(t, canAssign));
  });
  pane.innerHTML=html;
  bindOpenForm();
}
/* Manager-only: open a brand-new schedule (pick day/date, time, language and,
   optionally, a guide). Reuses the assign action, which creates the grid slot
   if it doesn't exist yet. Leaving the guide empty opens an unassigned slot. */
function openScheduleForm(){
  const langs=Object.keys(GUIDES_BY_LANG||{});
  if(!langs.length) langs.push("English","German","Spanish","Italian","French");
  const langOpts=langs.map(l=>'<option>'+esc(l)+'</option>').join("");
  return '<details class="openform"><summary>➕ Open a schedule</summary>'+
    '<div class="ofrow">'+
      '<label>Date<input type="date" class="of-date"></label>'+
      '<label>Time<input type="text" class="of-time" placeholder="11:00" value="11:00"></label>'+
    '</div>'+
    '<div class="ofrow">'+
      '<label>Language<select class="of-lang">'+langOpts+'</select></label>'+
      '<label>Guide<select class="of-guide"><option value="">Not assigned</option></select></label>'+
    '</div>'+
    '<div class="ofrow"><button class="of-open">Open schedule</button><span class="of-msg"></span></div>'+
    '</details>';
}
function bindOpenForm(){
  const form=document.querySelector(".openform"); if(!form) return;
  const langSel=form.querySelector(".of-lang"), guideSel=form.querySelector(".of-guide");
  const fillGuides=()=>{ const gs=(GUIDES_BY_LANG||{})[langSel.value]||[];
    guideSel.innerHTML='<option value="">Not assigned</option>'+gs.map(n=>'<option>'+esc(n)+'</option>').join(""); };
  langSel.onchange=fillGuides; fillGuides();
  form.querySelector(".of-open").onclick=async ()=>{
    const msg=form.querySelector(".of-msg");
    const dateKey=form.querySelector(".of-date").value;
    const time=(form.querySelector(".of-time").value||"").trim();
    const language=langSel.value, guide=guideSel.value;
    if(!dateKey||!time){ msg.textContent="Pick a date and time."; return; }
    const btn=form.querySelector(".of-open"); btn.disabled=true; msg.textContent="Opening…"; LAST_EDIT=Date.now();
    try{
      const r=await api("assign",{token:store.token,dateKey:dateKey,time:time,language:language,guide:guide,force:"1"});
      if(!r.ok){ msg.textContent=r.error||"Error"; btn.disabled=false; return; }
      msg.textContent="Opened ✓"; setTimeout(loadTours,700);
    }catch(err){ msg.textContent="Network problem"; btn.disabled=false; }
  };
}
/* Manager-only: dropdown of guides who SPEAK the tour's language. Picking one
   writes it into the Schedule_<Language> grid in bold (= a management lock). */
function assignSelect(t){
  // Server-computed: guides who speak the language AND have no other tour
  // within 5h. The current assignee stays listed even if now conflicted.
  let opts=(t.eligible||GUIDES_BY_LANG[t.language]||[]).slice();
  const cur=(t.assigned&&t.assigned[0])||"";
  if(cur && opts.indexOf(cur)===-1) opts=[cur].concat(opts);
  let html='<select class="asgsel" data-assign=\''+esc(JSON.stringify({dateKey:t.dateKey,time:t.time,language:t.language,isPrivate:t.isPrivate?1:"",privIndex:t.privIndex||1}))+'\'>';
  html+='<option value=""'+(cur?'':' selected')+'>Not assigned</option>';
  opts.forEach(n=>{ html+='<option value="'+esc(n)+'"'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'; });
  return html+'</select>';
}
function tourCard(t, canAssign){
  const missN = Math.max(0, t.bookedGuests - t.checkedGuests);
  const sub = missN>0 ? '<div class="sub">'+missN+' to check in</div>' : '<div class="sub done">all checked</div>';
  const assigned = (t.assigned && t.assigned.length) ? t.assigned : (canAssign ? [] : [store.name].concat(t.coGuides||[]));
  let chips = assigned.map(n=>'<span class="chip"><span class="avatar">'+esc(initials(n))+'</span>'+esc(n)+'</span>').join("");
  if(!assigned.length && canAssign) chips='<span class="chip miss">Not assigned</span>';
  if(canAssign) chips+=assignSelect(t);
  let bk = t.bookings.map((b,i)=>bookingRow(t.id,b,i,canAssign,t.language)).join("");
  if(!t.bookings.length) bk='<div class="empty" style="padding:18px">No bookings yet.</div>';
  const srcSet=Array.from(new Set(t.bookings.map(b=>b.source))).filter(Boolean); if(!srcSet.length) srcSet.push("Website");
  const walk = srcSet.map(s=>'<div class="wl"><span class="lbl">Walk-in ('+esc(s)+')</span>'+stepper(t.id,"walk|"+s,0,99,0)+'</div>').join("");
  // Small round ✕ in the card's top-right corner — closes the schedule.
  const closeBtn=canAssign?'<button class="closebtn" data-close="'+esc(t.id)+'" title="Close this schedule">✕</button>':'';
  return '<div class="tour" data-tour="'+esc(t.id)+'">'+ closeBtn +
    '<div class="head js-toggle">'+
      '<span class="time">'+esc(t.timeLabel||t.time)+'</span>'+ flagImg(t.language)+
      (t.isPrivate?'<span class="pill priv">Private</span>':'')+'<span class="spacer"></span>'+
      '<div class="count"><div class="big"><span class="ck">'+t.checkedGuests+'</span> / '+t.bookedGuests+(t.bookedChildren?'<span class="kids">+'+t.bookedChildren+'</span>':'')+'</div>'+sub+'</div>'+
    '</div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="bookings">'+bk+
      '<div class="walkins">'+walk+'</div>'+
      '<div class="savebar"><span class="msg" data-msg="'+esc(t.id)+'"></span></div>'+
    '</div></div>';
}
function bookingRow(tourId,b,i,canAssign,lang){
  const wa = digits(b.phone) ? '<a class="wa" target="_blank" href="https://wa.me/'+digits(b.phone)+'">'+WA_ICON+'</a>' : '';
  const ph = b.phone ? '<a class="ph" href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a>' : '';
  const note = b.note ? '<div class="bnote">'+esc(b.note)+'</div>' : '';
  const mv = (canAssign&&b.bookingId) ?
    '<select class="mvsel" data-move=\''+esc(JSON.stringify({bookingId:b.bookingId,from:lang,name:b.name||b.bookingId}))+'\'>'+
    ['English','German','Spanish','French','Italian'].map(L=>'<option'+(L===lang?' selected':'')+'>'+L+'</option>').join('')+'</select>' : '';
  // Per-booking note: a small post-it icon next to the language dropdown.
  const ref = esc(tourId+'~'+i);
  const hasN = !!b.manualNote;
  const noteBtn = (canAssign||hasN) && b.bookingId
    ? '<button class="bnotebtn'+(hasN?' has':'')+'" data-bnote="'+ref+'" title="'+(hasN?esc(b.manualNote):'Add a note')+'">'+POSTIT+'</button>' : '';
  const noteEditor = canAssign && b.bookingId
    ? '<div class="bnotepanel" data-bnp="'+ref+'" hidden><textarea class="bnoteta" placeholder="Note for this booking…">'+esc(b.manualNote||'')+'</textarea>'+
      '<div class="noterow"><button class="bnotesave" data-bns="'+ref+'" data-bid="'+esc(b.bookingId)+'" data-blang="'+esc(lang)+'">Save</button>'+
      '<button class="bnoteclose">Close</button><span class="notemsg" data-bnm="'+ref+'"></span></div></div>'
    : (hasN ? '<div class="bnotepanel" data-bnp="'+ref+'" hidden><div class="noteread">'+esc(b.manualNote)+'</div>'+
      '<div class="noterow"><button class="bnoteclose">Close</button></div></div>' : '');
  return '<div class="bkwrap"><div class="bk"><div class="nm"><b>'+esc(b.name||"—")+'</b>'+
    '<span class="src '+(b.paid?'paid':'free')+'">'+esc(b.source||"?")+'</span>'+(b.isPrivate?'<span class="src priv">Private</span>':'')+ph+note+mv+noteBtn+'</div>'+
    wa+ stepper(tourId,"bk|"+i,b.checkedIn,b.guests,b.guests,b.children)+
    '<button class="ckin'+(b.checked?' done':'')+'" data-ck="'+esc(tourId)+'~'+i+'"'+(b.checked?' disabled':'')+'>'+(b.checked?('✓ '+(b.checkedAt?esc(b.checkedAt):'In')):'Check in')+'</button>'+
    '</div>'+ noteEditor + '</div>';
}
function stepper(tourId,ref,val,max,total,kids){
  const kidsHtml = kids?'<span class="kids">+'+kids+'</span>':'';
  return '<div class="stepper" data-ref="'+esc(ref)+'" data-tour="'+esc(tourId)+'" data-max="'+max+'">'+
    '<button class="js-dec">−</button><span class="val">'+val+'</span>'+
    (total?'<span class="of">/'+total+kidsHtml+'</span>':'')+'<button class="js-inc">+</button></div>';
}
function bindTours(tours){
  TOURS_CACHE=tours;
  document.querySelectorAll(".tour:not(.static) .bookings").forEach(b=>{ b.style.display="none"; }); // start collapsed
  document.querySelectorAll(".js-toggle").forEach(h=>{ h.onclick=()=>{ const b=h.parentElement.querySelector(".bookings"); b.style.display = b.style.display==="none"?"":"none"; }; });
  document.querySelectorAll(".stepper").forEach(st=>{
    const val=st.querySelector(".val"), max=Number(st.dataset.max);
    st.querySelector(".js-dec").onclick=()=>{ val.textContent=Math.max(0,+val.textContent-1); recount(st.dataset.tour); };
    st.querySelector(".js-inc").onclick=()=>{ val.textContent=Math.min(max,+val.textContent+1); recount(st.dataset.tour); };
  });
  // Manager assign dropdowns.
  document.querySelectorAll(".asgsel").forEach(sel=>{
    sel.onchange=async ()=>{
      const info=JSON.parse(sel.dataset.assign);
      const newGuide=sel.value;
      MUTATING++; LAST_EDIT=Date.now();
      setPendingAssign(info, newGuide);          // remember the choice; render shows it now
      if(store.cache) renderAll(store.cache);     // instant, and stale reads can't undo it
      let ok=true, errMsg="";
      try{
        let r=await api("assign",Object.assign({token:store.token, guide:newGuide},info));
        if(!r.ok && r.conflict){
          // Management can ENFORCE the change — but never by accident.
          if(confirm(r.error+"\n\nAssign anyway?")){
            r=await api("assign",Object.assign({token:store.token, guide:newGuide, force:1},info));
          } else { ok=false; }
        }
        if(!r.ok){ ok=false; errMsg=r.conflict?"":(r.error||""); }
      }catch(err){ ok=false; errMsg=err.message||"Network problem — try again"; }
      if(!ok){ delete PENDING_ASSIGN[shiftIdKey(info)]; }   // write failed -> drop the optimistic value
      // Reconcile in the background. A stale read can't revert now: applyPendingAssigns
      // re-imposes the pending value on every render until the server confirms it.
      try{ await loadTours(); }catch(e){}
      MUTATING--;
      if(!ok && errMsg) alert(errMsg);
    };
  });
  // Manager: move a booking to another language's tour (guest agreed).
  document.querySelectorAll(".mvsel").forEach(sel=>{
    sel.onchange=async ()=>{
      const info=JSON.parse(sel.dataset.move);
      if(sel.value===info.from){ return; }
      if(!confirm("Move "+info.name+" from the "+info.from+" tour to the "+sel.value+" tour?")){ sel.value=info.from; return; }
      sel.disabled=true;
      try{
        const r=await api("move",{token:store.token,bookingId:info.bookingId,fromLanguage:info.from,toLanguage:sel.value});
        if(!r.ok){ alert(r.error||"Could not move"); sel.disabled=false; sel.value=info.from; return; }
        loadTours();
      }catch(err){ alert(err.message||"Network problem — try again"); sel.disabled=false; sel.value=info.from; }
    };
  });
  // Per-booking note: toggle the panel next to the language dropdown.
  document.querySelectorAll(".bnotebtn").forEach(btn=>{
    btn.onclick=(e)=>{ e.stopPropagation();
      const panel=btn.closest(".bkwrap").querySelector(".bnotepanel");
      if(panel){ panel.hidden=!panel.hidden; const ta=panel.querySelector(".bnoteta"); if(ta&&!panel.hidden) ta.focus(); }
    };
  });
  document.querySelectorAll(".bnoteclose").forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); const p=b.closest(".bnotepanel"); if(p) p.hidden=true; }; });
  document.querySelectorAll(".bnotesave").forEach(b=>{
    b.onclick=async (e)=>{ e.stopPropagation();
      const ref=b.dataset.bns, bookingId=b.dataset.bid, lang=b.dataset.blang, panel=b.closest(".bnotepanel");
      const ta=panel.querySelector(".bnoteta"), msg=panel.querySelector(".notemsg");
      const note=ta?ta.value:""; b.disabled=true; if(msg) msg.textContent="Saving…"; LAST_EDIT=Date.now();
      try{
        const r=await api("setNote",{token:store.token, bookingId:bookingId, language:lang, note:note});
        if(!r.ok){ if(msg) msg.textContent=r.error||"Error"; b.disabled=false; return; }
        if(msg) msg.textContent="Saved ✓";
        // Update the cache so a background refresh doesn't clobber the just-typed note.
        const parts=ref.split("~"), t=TOURS_CACHE.find(x=>x.id===parts[0]);
        if(t&&t.bookings[+parts[1]]) t.bookings[+parts[1]].manualNote=r.note;
        setTimeout(loadTours,700);
      }catch(err){ if(msg) msg.textContent="Network problem"; b.disabled=false; }
    };
  });
  // Management: close a schedule — no confirmation, it just disappears (and
  // comes back on its own if someone books it).
  document.querySelectorAll(".closebtn").forEach(btn=>{
    btn.onclick=async (e)=>{ e.stopPropagation();
      const id=btn.dataset.close; btn.disabled=true; LAST_EDIT=Date.now();
      const card=btn.closest(".tour"); if(card) card.remove();
      try{
        const r=await api("closeShift",{token:store.token, id:id});
        if(!r.ok){ alert(r.error||"Could not close it"); loadTours(); return; }
        setTimeout(loadTours,700);
      }catch(err){ alert("Network problem"); loadTours(); }
    };
  });
  // Check-in button per reservation: set the count, lock the row, save.
  document.querySelectorAll(".ckin:not(.done)").forEach(btn=>{
    btn.onclick=()=>{
      const parts=btn.dataset.ck.split("~"); const tid=parts[0], idx=+parts[1];
      const t=TOURS_CACHE.find(x=>x.id===tid); if(!t) return;
      const card=btn.closest('.tour');
      const sval=card.querySelector('.stepper[data-ref="bk|'+idx+'"] .val');
      const b=t.bookings[idx]; b.checked=true; b.checkedIn=+(sval?sval.textContent:b.checkedIn);
      const _n=new Date(); b.checkedAt=String(_n.getHours()).padStart(2,"0")+":"+String(_n.getMinutes()).padStart(2,"0");
      btn.classList.add("done"); btn.disabled=true; btn.textContent="✓ "+b.checkedAt;
      card.querySelectorAll('.stepper[data-ref="bk|'+idx+'"] button').forEach(x=>x.disabled=true);
      recount(tid); saveTour(tid);
    };
  });
}
function recount(tourId){
  const card=document.querySelector('.tour[data-tour="'+cssq(tourId)+'"]'); let sum=0;
  const t=TOURS_CACHE.find(x=>x.id===tourId);
  card.querySelectorAll('.stepper[data-ref^="bk|"]').forEach(st=>{ const idx=+st.dataset.ref.split("|")[1]; const b=t&&t.bookings[idx]; if(b&&b.checked) sum+=+st.querySelector('.val').textContent; });
  card.querySelector('.count .ck').textContent=sum;
  const total=Number((TOURS_CACHE.find(x=>x.id===tourId)||{}).bookedGuests||0);
  const sub=card.querySelector('.count .sub'); const miss=Math.max(0,total-sum);
  sub.className='sub'+(miss?'':' done'); sub.textContent=miss?miss+' to check in':'all checked';
}
async function saveTour(tourId,btn){
  const t=TOURS_CACHE.find(x=>x.id===tourId); if(!t) return;
  const card=document.querySelector('.tour[data-tour="'+cssq(tourId)+'"]');
  const bookings=t.bookings.map((b,i)=>{ const st=card.querySelector('.stepper[data-ref="bk|'+i+'"] .val');
    return {bookingId:b.bookingId,source:b.source,name:b.name,phone:b.phone,guests:b.guests,children:b.children||0,income:b.income,isPrivate:b.isPrivate,manualNote:b.manualNote||"",checked:!!b.checked,checkedIn:+(st?st.textContent:b.checkedIn)}; });
  const walkins=[]; card.querySelectorAll('.stepper[data-ref^="walk|"]').forEach(st=>{ const source=st.dataset.ref.split("|")[1]; const count=+st.querySelector(".val").textContent; if(count>0) walkins.push({source,count}); });
  const data={dateKey:t.dateKey,time:t.time,timeLabel:t.timeLabel,day:t.day,language:t.language,bookings,walkins,guide:t.guide||""};
  const msg=card.querySelector('[data-msg]'); if(btn) btn.disabled=true; msg.style.color="var(--muted)"; msg.textContent="Saving…";
  MUTATING++; LAST_EDIT=Date.now();   // block auto-refresh from clobbering the check-in mid-save
  try{ const r=await api("save",{token:store.token,data:JSON.stringify(data)});
    if(r.ok){ msg.style.color="var(--ok)"; msg.textContent="Saved ✓"; DIRTY[tourId]=false; }
    else{ msg.style.color="var(--danger)"; msg.textContent=r.error||"Error"; } }
  catch(err){ msg.style.color="var(--danger)"; msg.textContent=err.message; }
  finally{ MUTATING--; }
  if(btn) btn.disabled=false; setTimeout(()=>{ if(!DIRTY[tourId]) msg.textContent=""; },4000);
}

/* ================== ALL GUIDES (read-only, non-managers) ================== */
function renderSchedule(rows){
  const pane=$("schedPane");
  if(!rows.length){ pane.innerHTML='<div class="empty">No upcoming schedule.</div>'; return; }
  let html="";
  groupByDay(rows).forEach(day=>{
    html+='<div class="dayhdr"><div><div class="d">'+dayTitle(day.dateKey)+'</div><div class="m">'+monthTitle(day.dateKey)+'</div></div>'+relBadge(day.dateKey)+'</div>';
    day.items.sort((a,b)=>String(a.time).localeCompare(String(b.time))).forEach(s=>{
      const miss = !s.assigned.length || (s.status && s.status!=="OK");
      const who = s.assigned.length
        ? s.assigned.map(n=>'<span class="chip"><span class="avatar">'+esc(initials(n))+'</span>'+esc(n)+'</span>').join(" ")
        : "Not assigned";
      html+='<div class="tour static"><div class="head">'+
        '<span class="time">'+esc(to12(s.time))+'</span>'+flagImg(s.language)+
        (s.private?'<span class="pill priv">Private</span>':'')+'<span class="spacer"></span>'+
        '<span class="guides'+(miss?' miss':'')+'">'+who+'</span></div></div>';
    });
  });
  pane.innerHTML=html;
}

if(store.token){ showDash(); }
