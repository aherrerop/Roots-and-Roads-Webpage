name: Viator auto-close empty tours

# Closes empty Viator departures inside each product's close-window.
# DRY_RUN defaults to true in the script — set the repo variable
# VIATOR_DRY_RUN to "false" (Settings → Secrets and variables → Actions →
# Variables) once you've confirmed a few dry runs look right.

on:
  # SCHEDULE DISABLED during setup to avoid spamming runs/alerts while we prove
  # the saved-session path works from GitHub. UNCOMMENT once a manual run reaches
  # the availability page successfully.
  #
  # Tours run at 10:30, 16:00 (Italian) and 17:00 Madrid, so we only need to act
  # ~10h before: ~00:30, 06:00, 07:00 Madrid. Cron is UTC and has no DST, so each
  # target is covered for both CEST (UTC+2) and CET (UTC+1), with a little lead.
  # NOTE: assumes ~10h close windows. If a product's window in the Control tab is
  # much larger (e.g. private P5 at 24h), widen these so its departures are seen.
  # schedule:
  #   - cron: '0,30 22,23 * * *'   # 00:30 Madrid close of the 10:30 tour (±DST)
  #   - cron: '0 4,5,6 * * *'      # 06:00/07:00 Madrid close of 16:00 & 17:00 (±DST)
  workflow_dispatch:              # manual "Run workflow" button

concurrency:
  group: viator-autoclose
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: viator-autoclose
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Reuse the verified Viator session between runs (refreshed each run).
      - name: Restore session
        uses: actions/cache@v4
        with:
          path: viator-autoclose/state.json
          key: viator-session-v1

      - name: Run bot
        working-directory: viator-autoclose
        env:
          BOOKING_WEBAPP_URL: ${{ secrets.BOOKING_WEBAPP_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          VIATOR_EMAIL: ${{ secrets.VIATOR_EMAIL }}
          VIATOR_PASSWORD: ${{ secrets.VIATOR_PASSWORD }}
          VIATOR_STORAGE_STATE_B64: ${{ secrets.VIATOR_STORAGE_STATE_B64 }}
          DRY_RUN: ${{ vars.VIATOR_DRY_RUN || 'true' }}
          HEADLESS: 'true'
        run: node close-empty-tours.js
